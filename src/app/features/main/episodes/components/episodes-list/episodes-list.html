@if ((episodes() | filterList: query() : searchQuery); as filteredEpisodes) {
  @if (filteredEpisodes.length) {
    <div class="render-list">
      @for (episode of filteredEpisodes; track episode.episodeId) {
        <app-episode-list-item [episode]="episode" />
      }
    </div>
  } @else {
    <app-empty-search />
  }
}
